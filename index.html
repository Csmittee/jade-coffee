<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jade Coffee · Taste of heaven</title>
    
    <meta name="description" content="Premium coffee capsules — smooth blends for every moment">
    <meta property="og:title" content="Jade Coffee">
    <meta property="og:description" content="Our capsule coffee is coming soon!">
    <meta property="og:image" content="https://res.cloudinary.com/dfiomi0lb/image/upload/v1773774149/Jade-logo-original.png">
    <meta property="og:url" content="https://jade.janishammer.com">
    
    <!-- Anti-flicker: hides page until injector builds correct navbar -->
    <style id="jh-anti-flicker">body { opacity: 0; }</style>
    
    <!-- INJECTORS (config must load before core) -->
    <script src="https://assets.janishammer.com/js/injector-config.js"></script>
    <script src="https://assets.janishammer.com/js/injector-core.js"></script>
    
    <style>
        /* No body background override – let injector handle it */
        
        .hero {
            min-height: 70vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 4rem 2rem;
        }
        
        .hero-logo {
            max-width: 400px;
            width: 100%;
            margin-bottom: 2rem;
            transition: transform 0.3s ease;
            filter: drop-shadow(0 10px 20px rgba(0,0,0,0.2));
        }
        
        .hero-logo:hover {
            transform: scale(1.02) translateY(-4px);
        }
        
        .hero h1 {
            font-size: 2.8rem;
            font-weight: 700;
            color: #fff;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
            margin-bottom: 1rem;
        }
        
        .hero h2 {
            font-size: 1.4rem;
            color: rgba(255,255,255,0.9);
            font-weight: 500;
            max-width: 600px;
        }
        
        .products-section {
            max-width: 1280px;
            margin: 0 auto;
            padding: 3rem 2rem;
        }
        
        .section-title {
            text-align: center;
            font-size: 2.2rem;
            color: #000000;
            margin-bottom: 2.5rem;
            text-shadow: none;
        }
        
        .product-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 2rem;
        }
        
        .product-card {
            background: rgba(255, 255, 255, 0.92);
            backdrop-filter: blur(8px);
            border-radius: 24px;
            padding: 2rem;
            text-align: center;
            transition: all 0.3s ease;
            border: 1px solid rgba(255,255,255,0.3);
        }

        .product-image {
            width: 100%;
            height: 200px;
            object-fit: contain;
            margin-bottom: 1rem;
            border-radius: 12px;
        }        
        .product-card:hover {
            transform: translateY(-8px);
            background: white;
            box-shadow: 0 20px 30px rgba(0,0,0,0.2);
        }
        
        .product-icon {
            font-size: 3rem;
            margin-bottom: 1rem;
        }
        
        .product-title {
            font-size: 1.4rem;
            font-weight: 700;
            color: #6F4E37;
            margin-bottom: 0.5rem;
        }
        
        .product-desc {
            color: #666;
            margin-bottom: 1rem;
            line-height: 1.4;
        }
        
        .product-price {
            font-size: 1.5rem;
            font-weight: 800;
            color: #A67B5B;
            margin-bottom: 1rem;
        }
        
        .product-price::before {
            content: "฿";
            font-size: 1.2rem;
        }
        
        .product-button {
            background: linear-gradient(135deg, #6F4E37, #A67B5B);
            color: white;
            border: none;
            padding: 0.8rem 1.5rem;
            border-radius: 40px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            width: 100%;
        }
        
        .product-button:hover {
            transform: scale(1.02);
            background: linear-gradient(135deg, #A67B5B, #C4A484);
        }

        .cart-modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.8);
            z-index: 10001;
            justify-content: center;
            align-items: center;
        }
        
        .cart-modal.active {
            display: flex;
        }
        
        .cart-content {
            background: white;
            width: 90%;
            max-width: 500px;
            border-radius: 24px;
            overflow: hidden;
            box-shadow: 0 20px 40px rgba(0,0,0,0.3);
        }
        
        .cart-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 1rem 1.5rem;
            background: #6F4E37;
            color: white;
        }
        
        .cart-header h2 {
            margin: 0;
            font-size: 1.3rem;
        }
        
        .cart-close {
            font-size: 1.8rem;
            cursor: pointer;
        }
        
        .cart-items {
            max-height: 400px;
            overflow-y: auto;
            padding: 1rem;
        }
        
        .cart-item {
            display: flex;
            align-items: center;
            gap: 1rem;
            padding: 1rem;
            border-bottom: 1px solid #eee;
        }
        
        .cart-item-image {
            width: 60px;
            height: 60px;
            object-fit: cover;
            border-radius: 12px;
        }
        
        .cart-item-details {
            flex: 1;
        }
        
        .cart-item-name {
            font-weight: 600;
        }
        
        .cart-item-price {
            color: #A67B5B;
            font-size: 0.9rem;
        }
        
        .cart-item-actions {
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }
        
        .cart-qty-btn {
            background: #f0f0f0;
            border: none;
            width: 28px;
            height: 28px;
            border-radius: 50%;
            cursor: pointer;
        }
        
        .cart-summary {
            padding: 1rem 1.5rem;
            border-top: 1px solid #eee;
            background: #f9f9f9;
        }
        
        .cart-total {
            display: flex;
            justify-content: space-between;
            font-weight: bold;
            font-size: 1.2rem;
            margin-bottom: 1rem;
        }
        
        .btn-quotation {
            background: #6F4E37;
            color: white;
            border: none;
            padding: 0.8rem;
            width: 100%;
            border-radius: 40px;
            font-weight: 600;
            cursor: pointer;
        }
        
        .toast {
            position: fixed;
            bottom: 100px;
            left: 50%;
            transform: translateX(-50%);
            background: #333;
            color: white;
            padding: 0.8rem 1.5rem;
            border-radius: 40px;
            z-index: 1001;
            opacity: 0;
            transition: opacity 0.3s;
            pointer-events: none;
        }
        
        .toast.show {
            opacity: 1;
        }        
        
        @media (max-width: 768px) {
            .hero h1 { font-size: 2rem; }
            .hero h2 { font-size: 1.1rem; }
            .product-grid { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>
    <section class="hero">
        <img src="https://res.cloudinary.com/dfiomi0lb/image/upload/v1773774149/Jade-logo-original.png" 
             alt="Jade Coffee" 
             class="hero-logo">
        <h1>Our capsule coffee is coming soon!</h1>
        <h2>The taste that you love every day</h2>
    </section>

    <section class="products-section">
        <h2 class="section-title">Our Collection</h2>
        <div class="product-grid" id="product-grid"></div>
    </section>
    
    <div class="cart-floating" id="cartFloating">
        <i class="fas fa-shopping-bag"></i>
        <span class="cart-count" id="cartCount">0</span>
    </div>
    
    <div id="cartModal" class="cart-modal">
        <div class="cart-content">
            <div class="cart-header">
                <h2><i class="fas fa-shopping-bag"></i> Your Cart</h2>
                <span class="cart-close" onclick="closeCart()">&times;</span>
            </div>
            <div class="cart-items" id="cartItems">
                <div style="text-align: center; padding: 2rem;">Your cart is empty</div>
            </div>
            <div class="cart-summary">
                <div class="cart-total">
                    <span>Total</span>
                    <span id="cartTotal">฿0</span>
                </div>
                <button class="btn-quotation" onclick="requestQuotation()">
                    <i class="fas fa-file-invoice"></i> Get Quotation
                </button>
            </div>
        </div>
    </div>
    
    <div id="toast" class="toast"></div>

    <script>
        async function loadProducts() {
            try {
                const response = await fetch('/products.json');
                const products = await response.json();
                renderProducts(products);
            } catch (error) {
                console.error('Error loading products:', error);
            }
        }
        
        function renderProducts(products) {
            const grid = document.getElementById('product-grid');
            if (!grid) return;
            
            grid.innerHTML = products.map(p => `
                <div class="product-card">
                    <img src="${p.main_image}" alt="${p.name}" class="product-image">
                    <h3 class="product-title">${p.name}</h3>
                    <p class="product-desc">${p.description}</p>
                    <div class="product-price">${p.price}</div>
                    <button class="product-button" onclick="event.stopPropagation(); addToCart({id:'${p.id}', name:'${p.name}', price:${p.price}, image:'${p.main_image}'})">Add to Cart</button>
                </div>
            `).join('');
        }
        loadProducts();
    </script>

    <script>
        let cart = JSON.parse(localStorage.getItem('jadeCart')) || [];
        
        function updateCartUI() {
            const cartCount = cart.reduce((sum, item) => sum + item.quantity, 0);
            document.getElementById('cartCount').innerText = cartCount;
            localStorage.setItem('jadeCart', JSON.stringify(cart));
            renderCartItems();
        }
        
        function renderCartItems() {
            const container = document.getElementById('cartItems');
            const totalSpan = document.getElementById('cartTotal');
            if (!container) return;
            
            if (cart.length === 0) {
                container.innerHTML = '<div style="text-align: center; padding: 2rem;">Your cart is empty</div>';
                if (totalSpan) totalSpan.innerText = '0';
                return;
            }
            
            let total = 0;
            container.innerHTML = cart.map((item, idx) => {
                total += item.price * item.quantity;
                return `
                    <div class="cart-item">
                        <img src="${item.image}" class="cart-item-image">
                        <div class="cart-item-details">
                            <div class="cart-item-name">${item.name}</div>
                            <div class="cart-item-price">฿${item.price.toLocaleString()}</div>
                        </div>
                        <div class="cart-item-actions">
                            <button class="cart-qty-btn" onclick="updateCartItem(${idx}, -1)">-</button>
                            <span>${item.quantity}</span>
                            <button class="cart-qty-btn" onclick="updateCartItem(${idx}, 1)">+</button>
                            <i class="fas fa-trash-alt" onclick="removeCartItem(${idx})" style="color: #F44336; cursor: pointer;"></i>
                        </div>
                    </div>
                `;
            }).join('');
            if (totalSpan) totalSpan.innerText = `฿${total.toLocaleString()}`;
        }
        
        function updateCartItem(index, change) {
            const newQty = cart[index].quantity + change;
            if (newQty <= 0) cart.splice(index, 1);
            else cart[index].quantity = newQty;
            updateCartUI();
        }
        
        function removeCartItem(index) {
            cart.splice(index, 1);
            updateCartUI();
        }
        
        function addToCart(product) {
            const existing = cart.find(i => i.id === product.id);
            if (existing) existing.quantity++;
            else cart.push({...product, quantity: 1});
            updateCartUI();
            showToast(`Added ${product.name} to cart`);
        }
        
        function showToast(msg) {
            const toast = document.getElementById('toast');
            if (toast) {
                toast.textContent = msg;
                toast.classList.add('show');
                setTimeout(() => toast.classList.remove('show'), 2000);
            }
        }
        
        function openCart() {
            document.getElementById('cartModal').classList.add('active');
            renderCartItems();
        }
        
        function closeCart() {
            document.getElementById('cartModal').classList.remove('active');
        }
        
        function requestQuotation() {
            if (cart.length === 0) {
                showToast('Please add items to your cart first');
                return;
            }
            let items = cart.map(i => `${i.name} x ${i.quantity} = ฿${(i.price * i.quantity).toLocaleString()}`).join('\n');
            let total = cart.reduce((s, i) => s + i.price * i.quantity, 0);
            let subject = encodeURIComponent('Quotation Request - Jade Coffee');
            let body = encodeURIComponent(`Hello Jade Coffee Team,\n\nI would like a quotation for:\n\n${items}\n\nTotal: ฿${total.toLocaleString()}\n\nPlease contact me.\n\nBest regards`);
            window.location.href = `mailto:info@janishammer.com?subject=${subject}&body=${body}`;
            showToast('Opening email client...');
        }
        
        document.getElementById('cartFloating').addEventListener('click', openCart);
    </script>
</body>
</html>
